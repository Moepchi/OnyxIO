name: tests
on: [push, pull_request]
jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python deck.py test
      - run: python darkmount.py test
      - run: python sdhost.py test
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: xvfb-run -a python deck.py test
      - run: python darkmount.py test
      - run: python sdhost.py test
